plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mp3master.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.mp3master.app"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.4"
    }

    signingConfigs {
        mp3master {
            storeFile file('mp3master-signing.jks')
            storePassword 'mp3master2026'
            keyAlias 'mp3master'
            keyPassword 'mp3master2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.mp3master
        }
        release {
            signingConfig signingConfigs.mp3master
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.9'
}
